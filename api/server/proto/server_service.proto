syntax = "proto3";

package configure.api.server;

import "api/server/proto/server.proto";
import "google/api/annotations.proto";

option go_package = "configure/api/server;server";
option java_multiple_files = true;
option java_package = "configure.api.server";

service Server {
  // ListServer 获取服务信息列表
  rpc ListServer(ListServerRequest) returns (ListServerResponse) {
    option (google.api.http) = {get: "/configure/api/v1/servers"};
  }

  // CreateServer 创建服务信息
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse) {
    option (google.api.http) = {
      post: "/configure/api/v1/server"
      body: "*"
    };
  }

  // UpdateServer 更新服务信息
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse) {
    option (google.api.http) = {
      put: "/configure/api/v1/server"
      body: "*"
    };
  }

  // DeleteServer 删除服务信息
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse) {
    option (google.api.http) = {delete: "/configure/api/v1/server"};
  }
}
