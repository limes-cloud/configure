syntax = "proto3";

package configure.api.template;

import "validate/validate.proto";

option go_package = "configure/api/template;template";
option java_multiple_files = true;
option java_package = "configure.api.template";

message ListTemplateRequest {
  uint32 page = 1 [(validate.rules).uint32 = {gt: 0}];
  uint32 pageSize = 2 [(validate.rules).uint32 = {
    gt: 0
    lte: 50
  }];
  optional string app = 3 [(validate.rules).string = {
    max_len: 32
  }];
  optional string namespace = 4 [(validate.rules).string = {max_len: 32}];
}

message ListTemplateResponse {
  message Template {
    uint32 id = 1;
    string app = 2;
    string namespace = 3;
    string description = 4;
    string version = 5;
    string format = 6;
    bool isUse = 7;
    string compare = 8;
    uint32 createdAt = 9;
  }

  uint32 total = 1;
  repeated Template list = 2;
}

message ListTemplateNamespaceRequest {
  uint32 page = 1 [(validate.rules).uint32 = {gt: 0}];
  uint32 pageSize = 2 [(validate.rules).uint32 = {
    gt: 0
    lte: 50
  }];
  optional string app = 3 [(validate.rules).string = {
    max_len: 32
  }];
  optional string namespace = 4 [(validate.rules).string = {max_len: 64}];
  optional string name = 5 [(validate.rules).string = {max_len: 64}];
}

message ListTemplateNamespaceResponse {
  message TemplateNamespace {
    uint32 id = 1;
    string app = 2;
    string namespace = 3;
    string name = 4;
    optional string description = 5;
    uint32 sort = 6;
    uint32 createdAt = 7;
    uint32 updatedAt = 8;
  }

  uint32 total = 1;
  repeated TemplateNamespace list = 2;
}

message CreateTemplateNamespaceRequest {
  optional string app = 1 [(validate.rules).string = {
    max_len: 32
  }];
  string namespace = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  string name = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  optional string description = 4 [(validate.rules).string = {max_len: 255}];
  uint32 sort = 5;
}

message CreateTemplateNamespaceResponse {
  uint32 id = 1;
}

message UpdateTemplateNamespaceRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  string namespace = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  string name = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  optional string description = 4 [(validate.rules).string = {max_len: 255}];
  uint32 sort = 5;
}

message UpdateTemplateNamespaceResponse {}

message DeleteTemplateNamespaceRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message DeleteTemplateNamespaceResponse {}

message GetTemplateRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message GetTemplateResponse {
  uint32 id = 1;
  string app = 2;
  string namespace = 3;
  string description = 4;
  string version = 5;
  string format = 6;
  bool isUse = 7;
  string compare = 8;
  string content = 9;
  uint32 createdAt = 10;
}

message CurrentTemplateRequest {
  optional string app = 1 [(validate.rules).string = {
    max_len: 32
  }];
  optional string namespace = 2 [(validate.rules).string = {max_len: 32}];
}

message CurrentTemplateResponse {
  uint32 id = 1;
  string app = 2;
  string namespace = 3;
  string description = 4;
  string version = 5;
  string format = 6;
  bool isUse = 7;
  string compare = 8;
  string content = 9;
  uint32 createdAt = 10;
}

message CreateTemplateRequest {
  optional string app = 1 [(validate.rules).string = {
    max_len: 32
  }];
  optional string namespace = 2 [(validate.rules).string = {max_len: 32}];
  string content = 3 [(validate.rules).string = {min_len: 3}];
  string description = 4 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  string format = 5 [(validate.rules).string = {
    min_len: 1
    max_len: 64
    in: [
      "json",
      "yaml"
    ]
  }];
}

message CreateTemplateResponse {
  uint32 id = 1;
}

message SwitchTemplateRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  optional string app = 2 [(validate.rules).string = {
    max_len: 32
  }];
  optional string namespace = 3 [(validate.rules).string = {max_len: 32}];
}

message SwitchTemplateResponse {}

message CompareTemplateRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  string format = 2 [(validate.rules).string = {
    min_len: 1
    in: [
      "json",
      "yaml"
    ]
  }];
  string content = 3 [(validate.rules).string = {min_len: 1}];
}

message CompareTemplateResponse {
  message CompareInfo {
    string type = 1;
    string key = 2;
    string old = 3;
    string cur = 4;
  }

  repeated CompareInfo list = 1;
}

message PreviewTemplateRequest {
  uint32 envId = 1 [(validate.rules).uint32 = {gt: 0}];
  optional string app = 2 [(validate.rules).string = {
    max_len: 32
  }];
  optional string namespace = 3 [(validate.rules).string = {max_len: 32}];
  string format = 4 [(validate.rules).string = {
    min_len: 1
    in: [
      "json",
      "yaml"
    ]
  }];
  string content = 5 [(validate.rules).string = {min_len: 7}];
}

message PreviewTemplateResponse {
  string content = 1;
}
