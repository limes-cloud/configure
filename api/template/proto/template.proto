syntax = "proto3";

package configure.api.template;

import "validate/validate.proto";

option go_package = "configure/api/template;template";
option java_multiple_files = true;
option java_package = "configure.api.template";

message ListTemplateRequest {
  uint32 page = 1 [(validate.rules).uint32 = {gt: 0}];
  uint32 pageSize = 2 [(validate.rules).uint32 = {
    gt: 0
    lte: 50
  }];
  uint32 serverId = 3 [(validate.rules).uint32 = {gt: 0}];
}

message ListTemplateResponse {
  message Template {
    uint32 id = 1;
    uint32 serverId = 2;
    string description = 3;
    string version = 4;
    string format = 5;
    bool isUse = 6;
    string compare = 7;
    uint32 createdAt = 8;
  }

  uint32 total = 1;
  repeated Template list = 2;
}

message GetTemplateRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message GetTemplateResponse {
  uint32 id = 1;
  uint32 serverId = 2;
  string description = 3;
  string version = 4;
  string format = 5;
  bool isUse = 6;
  string compare = 7;
  string content = 8;
  uint32 createdAt = 9;
}

message CurrentTemplateRequest {
  uint32 serverId = 1 [(validate.rules).uint32 = {gt: 0}];
}

message CurrentTemplateResponse {
  uint32 id = 1;
  uint32 serverId = 2;
  string description = 3;
  string version = 4;
  string format = 5;
  bool isUse = 6;
  string compare = 7;
  string content = 8;
  uint32 createdAt = 9;
}

message CreateTemplateRequest {
  uint32 serverId = 1 [(validate.rules).uint32 = {gt: 0}];
  string content = 2 [(validate.rules).string = {min_len: 3}];
  string description = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  string format = 4 [(validate.rules).string = {
    min_len: 1
    max_len: 64
    in: ["json", "yaml"]
  }];
}

message CreateTemplateResponse {
  uint32 id = 1;
}

message SwitchTemplateRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  uint32 serverId = 2 [(validate.rules).uint32 = {gt: 0}];
}

message SwitchTemplateResponse {}

message CompareTemplateRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  string format = 2 [(validate.rules).string = {
    min_len: 1
    in: ["json", "yaml"]
  }];
  string content = 3 [(validate.rules).string = {min_len: 1}];
}

message CompareTemplateResponse {
  message CompareInfo {
    string type = 1;
    string key = 2;
    string old = 3;
    string cur = 4;
  }

  repeated CompareInfo list = 1;
}

message PreviewTemplateRequest {
  uint32 envId = 1 [(validate.rules).uint32 = {gt: 0}];
  uint32 serverId = 2 [(validate.rules).uint32 = {gt: 0}];
  string format = 3 [(validate.rules).string = {
    min_len: 1
    in: ["json", "yaml"]
  }];
  string content = 4 [(validate.rules).string = {min_len: 7}];
}

message PreviewTemplateResponse {
  string content = 1;
}
