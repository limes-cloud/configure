syntax = "proto3";

package configure.api.business;

import "validate/validate.proto";

option go_package = "configure/api/business;business";
option java_multiple_files = true;
option java_package = "configure.api.business";

message ListBusinessRequest {
  uint32 page = 1 [(validate.rules).uint32 = {gt: 0}];
  uint32 pageSize = 2 [(validate.rules).uint32 = {
    gt: 0
    lte: 50
  }];
  optional string order = 3 [(validate.rules).string = {
    in: [
      "asc",
      "desc"
    ]
  }];
  optional string orderBy = 4 [(validate.rules).string = {
    in: ["id"]
  }];
  string app = 5 [(validate.rules).string = {
    min_len: 1
    max_len: 32
  }];
  optional string keyword = 6;
}

message ListBusinessResponse {
  message Business {
    uint32 id = 1;
    string app = 2;
    string keyword = 3;
    string type = 4;
    optional string description = 5;
    uint32 createdAt = 6;
    uint32 updatedAt = 7;
  }

  uint32 total = 1;
  repeated Business list = 2;
}

message CreateBusinessRequest {
  string app = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 32
  }];
  string keyword = 2 [(validate.rules).string = {min_len: 1}];
  string type = 3 [(validate.rules).string = {min_len: 1}];
  optional string description = 4;
}

message CreateBusinessResponse {
  uint32 id = 1;
}

message UpdateBusinessRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  string keyword = 2 [(validate.rules).string = {min_len: 1}];
  string type = 3 [(validate.rules).string = {min_len: 1}];
  optional string description = 4;
}

message UpdateBusinessResponse {}

message DeleteBusinessRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message DeleteBusinessResponse {}

message ListBusinessValueRequest {
  uint32 businessId = 1 [(validate.rules).uint32 = {gt: 0}];
}

message ListBusinessValueResponse {
  message BusinessValue {
    uint32 id = 1;
    uint32 envId = 2;
    uint32 businessId = 3;
    string value = 4;
    uint32 createdAt = 5;
    uint32 updatedAt = 6;
  }

  uint32 total = 1;
  repeated BusinessValue list = 2;
}

message UpdateBusinessValueRequest {
  message Value {
    uint32 envId = 1 [(validate.rules).uint32 = {gt: 0}];
    string value = 2 [(validate.rules).string = {min_len: 1}];
  }

  repeated Value list = 1 [(validate.rules).repeated = {min_items: 1}];
  uint32 businessId = 2 [(validate.rules).uint32 = {gt: 0}];
}

message UpdateBusinessValueResponse {}
