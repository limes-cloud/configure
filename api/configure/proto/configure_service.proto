syntax = "proto3";

package configure.api.configure;

import "api/configure/proto/configure.proto";
import "google/api/annotations.proto";

option go_package = "configure/api/configure;configure";
option java_multiple_files = true;
option java_package = "configure.api.configure";

service Configure {
  // GetConfigure 获取配置
  rpc GetConfigure(GetConfigureRequest) returns (GetConfigureResponse) {
    option (google.api.http) = {get: "/configure/api/v1/configure"};
  }

  // UpdateConfigure 更新配置
  rpc UpdateConfigure(UpdateConfigureRequest) returns (UpdateConfigureResponse) {
    option (google.api.http) = {
      put: "/configure/api/v1/configure"
      body: "*"
    };
  }

  // CompareConfigure 对比配置与模板差异
  rpc CompareConfigure(CompareConfigureRequest) returns (CompareConfigureResponse) {
    option (google.api.http) = {
      post: "/configure/api/v1/configure/compare"
      body: "*"
    };
  }

  // WatchConfigure 监听配置变更（gRPC stream）
  rpc WatchConfigure(WatchConfigureRequest) returns (stream WatchConfigureResponse);
}
