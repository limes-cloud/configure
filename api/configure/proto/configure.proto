syntax = "proto3";

package configure.api.configure;

import "validate/validate.proto";

option go_package = "configure/api/configure;configure";
option java_multiple_files = true;
option java_package = "configure.api.configure";

message GetConfigureRequest {
  string app = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 32
  }];
  uint32 envId = 2 [(validate.rules).uint32 = {gt: 0}];
}

message GetConfigureResponse {
  uint32 id = 1;
  string app = 2;
  uint32 envId = 3;
  string content = 4;
  string description = 5;
  string version = 6;
  string format = 7;
  uint32 createdAt = 8;
}

message UpdateConfigureRequest {
  string app = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 32
  }];
  uint32 envId = 2 [(validate.rules).uint32 = {gt: 0}];
  string description = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
}

message UpdateConfigureResponse {}

message CompareConfigureRequest {
  string app = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 32
  }];
  uint32 envId = 2 [(validate.rules).uint32 = {gt: 0}];
}

message CompareConfigureResponse {
  message Compare {
    string type = 1;
    string key = 2;
    string old = 3;
    string cur = 4;
  }

  repeated Compare list = 1;
}

message WatchConfigureRequest {
  string app = 1 [(validate.rules).string = {min_len: 1}];
  string token = 2 [(validate.rules).string = {min_len: 1}];
}

message WatchConfigureResponse {
  string content = 1;
  string format = 2;
}
