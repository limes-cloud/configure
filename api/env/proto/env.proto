syntax = "proto3";

package configure.api.env;

import "validate/validate.proto";

option go_package = "configure/api/env;env";
option java_multiple_files = true;
option java_package = "configure.api.env";

message ListEnvRequest {
  optional string keyword = 1;
  optional string name = 2;
  optional bool status = 3;
}

message ListEnvResponse {
  message Env {
    uint32 id = 1;
    string keyword = 2;
    string name = 3;
    optional bool status = 4;
    optional string description = 5;
    uint32 createdAt = 6;
    uint32 updatedAt = 7;
  }

  uint32 total = 1;
  repeated Env list = 2;
}

message CreateEnvRequest {
  string keyword = 1 [(validate.rules).string = {min_len: 1}];
  string name = 2 [(validate.rules).string = {min_len: 1}];
  optional bool status = 3;
  optional string description = 4;
}

message CreateEnvResponse {
  uint32 id = 1;
}

message UpdateEnvRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  string keyword = 2;
  string name = 3;
  optional bool status = 4;
  optional string description = 5;
}

message UpdateEnvResponse {}

message DeleteEnvRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message DeleteEnvResponse {}

message GetEnvTokenRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message GetEnvTokenResponse {
  string token = 1;
}

message ResetEnvTokenRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message ResetEnvTokenResponse {
  string token = 1;
}
