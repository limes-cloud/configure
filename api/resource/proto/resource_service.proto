syntax = "proto3";

package configure.api.resource;

import "api/resource/proto/resource.proto";
import "google/api/annotations.proto";

option go_package = "configure/api/resource;resource";
option java_multiple_files = true;
option java_package = "configure.api.resource";

service Resource {
  // GetResource 获取指定的资源配置信息
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = {get: "/configure/api/v1/resource"};
  }

  // ListResource 获取资源配置信息列表
  rpc ListResource(ListResourceRequest) returns (ListResourceResponse) {
    option (google.api.http) = {get: "/configure/api/v1/resources"};
  }

  // CreateResource 创建资源配置信息
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = {
      post: "/configure/api/v1/resource"
      body: "*"
    };
  }

  // UpdateResource 更新资源配置信息
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse) {
    option (google.api.http) = {
      put: "/configure/api/v1/resource"
      body: "*"
    };
  }

  // DeleteResource 删除资源配置信息
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = {delete: "/configure/api/v1/resource"};
  }

  // ListResourceValue 获取资源配置值信息列表
  rpc ListResourceValue(ListResourceValueRequest) returns (ListResourceValueResponse) {
    option (google.api.http) = {get: "/configure/api/v1/resource/values"};
  }

  // UpdateResourceValue 更新资源配置值信息
  rpc UpdateResourceValue(UpdateResourceValueRequest) returns (UpdateResourceValueResponse) {
    option (google.api.http) = {
      put: "/configure/api/v1/resource/values"
      body: "*"
    };
  }
}
